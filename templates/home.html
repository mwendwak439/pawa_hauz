{% extends 'base.html' %}

{% block title %}Home — Gym Management System{% endblock %}

{% block content %}
    <h2>Welcome</h2>
    {% if user.is_authenticated %}
        <p>Hello, {{ user.get_full_name|default:user.username }}.</p>
        <p>Your role: {{ user.get_role_display }}</p>
    {% else %}
        <p>Please <a href="{% url 'accounts:login' %}">log in</a>.</p>
    {% endif %}
{% endblock %}
