{% extends 'base.html' %}

{% block title %}Log In — Gym Management System{% endblock %}

{% block content %}
    <h2>Log In</h2>

    {% if form.errors %}
        <p style="color: red;">Your username and password did not match. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
{% endblock %}
